<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Piazza Resources Downloader</title>
	<script src='../scripts/popup.js' defer></script>
	<link rel="stylesheet" type="text/css" href="../css/popup.css">
</head>
<body>
	<header>
		<p id="pTitle">
			Piazza Resources Downloader+
			<img src="../images/download_symbol.png" height="20" width="20" alt="Download">
		</p>
		<p id="courseName"></p>
	</header>

	<main>
		<button id="download0" style="display:none;">Download Selected</button>

		<p id="pText"></p>


		<div id="selectAllRow" style="display:none;">
			<div id="selectAllCheckboxCell">
				<input type="checkbox" id="toggle_all">
			</div>
			<label for="toggle_all" id="selectAllLabel">Select all</label>
		</div>

		<div id="links" aria-live="polite"></div>

		<button id="download1" style="display:none;">Download Selected</button>
	</main>
</body>
</html>
